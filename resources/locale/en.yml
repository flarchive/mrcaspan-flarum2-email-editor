mrcaspan-flarum2-email-editor:
  admin:
    intro: Change the wording of every email the forum sends, and how the emails look. Emails added by extensions you install later appear here automatically.
    tab_emails: Emails
    tab_layout: Layout
    language_label: Language
    core_title: Flarum core
    general_texts: General texts
    search_placeholder: Search emails…
    no_matches: No emails match your search.
    pick_one: Pick an email on the left to edit it.
    edited_badge: Edited
    field_subject: Subject
    field_html: Body (HTML email)
    field_plain: Body (plain-text email)
    field_body: Body
    pair_html: HTML
    pair_text: Text
    insert_tag: Insert tag

    # What each shared tag is (Insert tag menu).
    tag_help:
      forumTitle: Forum name
      forumUrl: Forum web address
      settingsLink: Link to the recipient's notification settings
      userEmail: Recipient's email address
      username: Recipient's name
      unsubscribeLink: Unsubscribe link (notification emails only)
      type: Notification type, e.g. newPost (notification emails only)
      date: Today's date
      year: The current year

    # What the placeholders of individual emails are. Ones not listed show no explanation.
    placeholder_help:
      Event: Your word for an event (e.g. Game)
      Events: Your word for events (e.g. Games)
      event: Your word for an event, lowercase
      events: Your word for events, lowercase
      Attendee: Your word for an attendee (e.g. Player)
      Attendees: Your word for attendees (e.g. Players)
      attendee: Your word for an attendee, lowercase
      attendees: Your word for attendees, lowercase
      Spot: Your word for a spot (e.g. Seat)
      Spots: Your word for spots (e.g. Seats)
      spot: Your word for a spot, lowercase
      spots: Your word for spots, lowercase
      actor: Person who did it
      actor_display_name: Name of the person who did it
      content: Post content
      discussion_title: Discussion title
      discussion_url: Link to the discussion
      display_name: Name of the person who did it
      email: Recipient's email address
      forum: Forum name
      forum_url: Forum web address
      hours: Number of hours
      mentioner_display_name: Name of the person who mentioned
      new_email: The new email address
      package: Extension name
      post_content: Post content
      post_number: Post number
      post_url: Link to the post
      poster_display_name: Name of the person who posted
      provider: Login provider (e.g. Google)
      replacement: Suggested replacement extension
      replier_display_name: Name of the person who replied
      suspension_message: Reason given for the suspension
      title: Title (of the discussion or event)
      url: The link this email is about
      user_url: Link to the user's profile
      username: A user's name
    show_original: Show original
    hide_original: Hide original
    use_original: Use original
    empty_text: (empty)
    original_unknown: The original wording of this text can't be shown on this version of Flarum.
    save_button: Save
    undo_button: Undo changes
    preview_button: Preview
    send_test_button: Send test to me
    reset_all_button: Reset this email to original
    reset_all_confirm: Put every text in this email back to the original wording?
    discard_confirm: You have unsaved changes. Discard them?
    saved: Saved.
    save_failed: Couldn't save. Check the texts and try again.
    test_sent: "Test email sent to {email}."
    preview_tab_html: HTML
    preview_tab_text: Plain text
    view_html: HTML
    view_text: Plain text
    view_edit: Edit
    highlight: Highlight
    show_dark: Dark
    show_light: Light
    preview_failed: The preview couldn't be shown. Check the texts on the Edit tab.
    preview_help_notification: Preview and test use sample values for the placeholders, in Flarum's standard notification email. Unsaved changes are included.
    preview_help_real: Preview and test show the real email, built from the newest public post on the forum. Unsaved changes are included.
    preview_help_information: Preview and test use sample values for the placeholders, in Flarum's standard account email. Unsaved changes are included.

    # Server-side messages
    error_bad_request: The request was not understood.
    error_unknown_key: This isn't an email text.
    error_bad_placeholder: "This text has a broken placeholder, such as a { without a matching }. Fix it before saving, or emails using it would fail to send."
    test_subject_prefix: "[Test]"
    sample_subject: Sample email
    sample_body: This is a sample email body, so you can see the layout.
    sample_title: Friday night tournament
    sample_content: This is some sample post content.
    sample_user: SampleUser
    sample_reason: This is a sample suspension reason.

    layout:
      custom_layout: Use the custom layout
      custom_layout_help: When this is off, emails use Flarum's standard layout and the options below do nothing.
      show_title: Show the email title under the logo
      show_greeting: Show the greeting ("Hey name,")
      show_signoff: Show the sign-off ("The forum team")
      logo_align: Logo position
      align_left: Left
      align_center: Centre
      colors: Colours
      color_bg: Page background
      color_card: Email background
      color_border: Border
      color_text: Text
      color_accent: Links and title
      color_none: Default
      color_clear: Clear
      footer_text: Extra footer text
      footer_text_help: Added under the normal footer of every email. Markdown and tags work. Leave empty for none.
      preview_help: Preview and test show a sample notification email with these options, saved or not.
